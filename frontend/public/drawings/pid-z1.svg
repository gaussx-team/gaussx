<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <!-- 1구역 배관 계통도(P&ID 형식, 가상) -->
  <rect width="1000" height="560" fill="#fff"/>
  <rect x="6" y="6" width="988" height="548" fill="none" stroke="#111827" stroke-width="3"/>
  <text x="24" y="40" font-size="20" font-weight="700">1구역 불산(HF) 이송 라인 · P&amp;ID</text>
  <!-- 저장 탱크 -->
  <rect x="50" y="140" width="110" height="170" rx="40" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
  <text x="105" y="225" font-size="15" text-anchor="middle" font-weight="700">TK-101</text>
  <text x="105" y="245" font-size="12" text-anchor="middle">HF 55%</text>
  <!-- 주 배관 P-203 -->
  <path d="M160 260 H880" stroke="#dc2626" stroke-width="5"/>
  <text x="520" y="250" font-size="15" text-anchor="middle" font-weight="700" fill="#b91c1c">P-203  2"-HF-CS-PTFE</text>
  <!-- 차단 밸브 (나비넥타이 기호) -->
  <g transform="translate(260 260)"><polygon points="-16,-12 0,0 -16,12" fill="#fff" stroke="#111827" stroke-width="2.5"/><polygon points="16,-12 0,0 16,12" fill="#fff" stroke="#111827" stroke-width="2.5"/><line x1="0" y1="0" x2="0" y2="-24" stroke="#111827" stroke-width="2"/><rect x="-10" y="-32" width="20" height="8" fill="#111827"/></g>
  <text x="260" y="300" font-size="12" text-anchor="middle">XV-201 (잠금 대상)</text>
  <!-- 플랜지 -->
  <g stroke="#111827" stroke-width="3"><line x1="452" y1="242" x2="452" y2="278"/><line x1="462" y1="242" x2="462" y2="278"/></g>
  <text x="457" y="300" font-size="12" text-anchor="middle">플랜지 교체 지점</text>
  <!-- 압력계 -->
  <line x1="360" y1="260" x2="360" y2="190" stroke="#111827" stroke-width="2"/>
  <circle cx="360" cy="170" r="22" fill="#fff" stroke="#111827" stroke-width="2.5"/>
  <text x="360" y="167" font-size="11" text-anchor="middle">PI</text>
  <text x="360" y="180" font-size="10" text-anchor="middle">203</text>
  <text x="392" y="174" font-size="12">잔압 확인</text>
  <!-- 드레인 -->
  <path d="M560 260 V360" stroke="#dc2626" stroke-width="3"/>
  <g transform="translate(560 330) rotate(90)"><polygon points="-12,-9 0,0 -12,9" fill="#fff" stroke="#111827" stroke-width="2"/><polygon points="12,-9 0,0 12,9" fill="#fff" stroke="#111827" stroke-width="2"/></g>
  <text x="576" y="364" font-size="12">드레인 → 회수 드럼</text>
  <!-- 질소 퍼지 라인 V-11 -->
  <path d="M700 470 H700 V260" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 5"/>
  <path d="M520 470 H700" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 5"/>
  <g transform="translate(620 470)"><polygon points="-14,-10 0,0 -14,10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><polygon points="14,-10 0,0 14,10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/></g>
  <text x="620" y="500" font-size="13" text-anchor="middle" font-weight="700" fill="#1d4ed8">V-11 (N₂ 퍼지, 평상시 닫힘)</text>
  <text x="520" y="460" font-size="12" fill="#1d4ed8">N₂ 공급</text>
  <!-- 사용처 -->
  <rect x="880" y="220" width="90" height="80" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
  <text x="925" y="265" font-size="13" text-anchor="middle">반응기</text>
  <!-- 범례 / 표제란 -->
  <g transform="translate(24 420)" font-size="12">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#dc2626" stroke-width="4"/><text x="48" y="14">공정 배관(HF)</text>
    <line x1="0" y1="34" x2="40" y2="34" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 5"/><text x="48" y="38">질소 유틸리티</text>
  </g>
  <g transform="translate(760 470)">
    <rect width="220" height="72" fill="#fff" stroke="#111827" stroke-width="2"/>
    <text x="10" y="20" font-size="12" font-weight="700">GaussX 데모 현장 (가상)</text>
    <text x="10" y="38" font-size="12">P&amp;ID · 1구역 HF 라인</text>
    <text x="10" y="56" font-size="12">DWG P-201 · REV.C</text>
  </g>
</svg>
