<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <!-- 데모 현장 평면도 (가상). 800x600 = 4m x 3m, 1m = 200px. 태그 좌표(m)와 그대로 겹친다 -->
  <rect width="800" height="600" fill="#fdfdfb"/>
  <defs>
    <pattern id="g" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#e5e7eb" stroke-width="1"/></pattern>
    <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="2"/></pattern>
  </defs>
  <rect width="800" height="600" fill="url(#g)"/>
  <!-- 외벽 -->
  <rect x="4" y="4" width="792" height="592" fill="none" stroke="#111827" stroke-width="8"/>
  <!-- 구역 경계 (점선) -->
  <line x1="400" y1="4" x2="400" y2="300" stroke="#334155" stroke-width="3" stroke-dasharray="14 8"/>
  <line x1="4" y1="300" x2="400" y2="300" stroke="#334155" stroke-width="3" stroke-dasharray="14 8"/>
  <!-- 전기실 벽 + 문 -->
  <path d="M400 300 V596" stroke="#111827" stroke-width="6"/>
  <path d="M400 300 H260" stroke="#111827" stroke-width="6"/>
  <path d="M260 300 A60 60 0 0 1 200 360" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="18" y="34" font-size="22" font-weight="700" fill="#0f172a">1구역 · 배관</text>
  <text x="418" y="34" font-size="22" font-weight="700" fill="#0f172a">2구역 · 탱크</text>
  <text x="18" y="330" font-size="22" font-weight="700" fill="#0f172a">3구역 · 전기실</text>
  <!-- 1구역 배관 랙 -->
  <rect x="60" y="70" width="320" height="40" fill="url(#h)" stroke="#475569" stroke-width="2"/>
  <text x="66" y="128" font-size="13" fill="#475569">파이프 랙 (H 2.4m)</text>
  <path d="M40 90 H360" stroke="#dc2626" stroke-width="5"/>
  <path d="M240 82 v16 M250 82 v16" stroke="#111827" stroke-width="3"/>
  <text x="220" y="76" font-size="13" fill="#b91c1c" font-weight="700">P-203 (HF 55%)</text>
  <path d="M90 220 H200" stroke="#2563eb" stroke-width="4"/>
  <polygon points="80,212 96,220 80,228" fill="#2563eb"/>
  <text x="104" y="246" font-size="13" fill="#1d4ed8">N₂ 퍼지 라인 · V-11</text>
  <!-- 2구역 탱크 + 방류벽 -->
  <rect x="540" y="40" width="200" height="200" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="546" y="258" font-size="12" fill="#64748b">방류벽</text>
  <circle cx="620" cy="120" r="64" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/>
  <text x="620" y="116" font-size="16" text-anchor="middle" font-weight="700" fill="#9a3412">T-02</text>
  <text x="620" y="136" font-size="12" text-anchor="middle" fill="#9a3412">H₂SO₄ 98%</text>
  <rect x="470" y="196" width="60" height="36" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="500" y="219" font-size="12" text-anchor="middle">PU-07</text>
  <path d="M530 214 H556" stroke="#c2410c" stroke-width="4"/>
  <!-- 3구역 전기실 -->
  <rect x="60" y="370" width="80" height="40" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/>
  <text x="100" y="395" font-size="13" text-anchor="middle" font-weight="700" fill="#3730a3">MCC-3</text>
  <rect x="250" y="490" width="100" height="40" fill="none" stroke="#475569" stroke-width="2"/>
  <circle cx="300" cy="510" r="14" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="300" y="550" font-size="12" text-anchor="middle" fill="#475569">환기팬 F-2</text>
  <!-- 출입구 / 비상구 -->
  <rect x="700" y="592" width="80" height="8" fill="#16a34a"/>
  <text x="740" y="584" font-size="12" text-anchor="middle" fill="#15803d">출입구</text>
  <rect x="792" y="300" width="8" height="70" fill="#16a34a"/>
  <text x="784" y="296" font-size="12" text-anchor="end" fill="#15803d">비상구</text>
  <!-- 로봇 대기 -->
  <rect x="632" y="452" width="56" height="56" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="660" y="526" font-size="12" text-anchor="middle" fill="#c2410c">로봇 대기</text>
  <!-- 치수 -->
  <text x="400" y="590" font-size="13" text-anchor="middle" fill="#334155">4,000</text>
  <text x="14" y="300" font-size="13" fill="#334155" transform="rotate(-90 14 300)">3,000</text>
  <!-- 표제란 -->
  <g transform="translate(470 520)">
    <rect width="150" height="66" fill="#fff" stroke="#111827" stroke-width="2"/>
    <text x="8" y="18" font-size="11" font-weight="700">GaussX 데모 현장 (가상)</text>
    <text x="8" y="34" font-size="11">평면도 · 축척 1:20</text>
    <text x="8" y="50" font-size="11">DWG A-101 · REV.B</text>
    <text x="8" y="62" font-size="9" fill="#64748b">단위 mm</text>
  </g>
</svg>
